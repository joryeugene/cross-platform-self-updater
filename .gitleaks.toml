title = "cross-platform-self-updater"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Installation tests generate an in-memory Ed25519 key through this typed fixture."
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_installation\.py$''']
regexes = ['''private_key:\s*Ed25519PrivateKey''']
